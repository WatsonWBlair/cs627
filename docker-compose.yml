version: '3.8'

services:
  # Token Pre-generation Service (GPU)
  pregenerate-tokens:
    image: watsonwb/cs627-svs:gpu
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cs627-pregenerate
    environment:
      - DEVICE=${DEVICE:-cuda}
      - BATCH_SIZE=${BATCH_SIZE:-32}
      - OUTPUT_DIR=/workspace/data/pregenerated_tokens
      - MOSI_DATA_PATH=/workspace/data/cmumosi/mosi/
      - AUDIO_DIR=/workspace/data/cmumosi/audio/
      - VIDEO_DIR=/workspace/data/cmumosi/frames/
    volumes:
      - ./data:/workspace/data
      - ./src:/workspace/src
      - ./OptimalWeights:/workspace/OptimalWeights
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command: python src/Training/pregenerate_tokens.py
    restart: "no"

  # Token Pre-generation Service (CPU)
  pregenerate-tokens-cpu:
    image: watsonwb/cs627-svs:cpu
    build:
      context: .
      dockerfile: Dockerfile.cpu
    container_name: cs627-pregenerate-cpu
    environment:
      - DEVICE=cpu
      - BATCH_SIZE=${BATCH_SIZE:-16}
      - OUTPUT_DIR=/workspace/data/pregenerated_tokens
      - MOSI_DATA_PATH=/workspace/data/cmumosi/mosi/
      - AUDIO_DIR=/workspace/data/cmumosi/audio/
      - VIDEO_DIR=/workspace/data/cmumosi/frames/
    volumes:
      - ./data:/workspace/data
      - ./src:/workspace/src
      - ./OptimalWeights:/workspace/OptimalWeights
    command: python src/Training/pregenerate_tokens.py
    restart: "no"

  # Adapter Training Service (GPU)
  train-adapters-gpu:
    image: watsonwb/cs627-svs:gpu
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cs627-train-adapters
    environment:
      - DEVICE=cuda
      - BATCH_SIZE=${BATCH_SIZE:-256}
      - LEARNING_RATE=${LEARNING_RATE:-0.001}
      - EPOCHS=${EPOCHS:-50}
      - TOKEN_DIR=/workspace/data/pregenerated_tokens/mosi
      - ADAPTER_HIDDEN_SIZE=${ADAPTER_HIDDEN_SIZE:-512}
      - ADAPTER_LAYERS=${ADAPTER_LAYERS:-2}
      - USE_AMP=1
      - GRADIENT_ACCUMULATION=${GRADIENT_ACCUMULATION:-1}
    volumes:
      - ./data:/workspace/data
      - ./src:/workspace/src
      - ./OptimalWeights:/workspace/OptimalWeights
      - ./Results:/workspace/Results
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command: python src/Training/train_adapters.py --mode encoder
    restart: unless-stopped

  # Adapter Training Service (CPU)
  train-adapters-cpu:
    image: watsonwb/cs627-svs:cpu
    build:
      context: .
      dockerfile: Dockerfile.cpu
    container_name: cs627-train-adapters-cpu
    environment:
      - DEVICE=cpu
      - BATCH_SIZE=${BATCH_SIZE:-128}
      - LEARNING_RATE=${LEARNING_RATE:-0.001}
      - EPOCHS=${EPOCHS:-50}
      - TOKEN_DIR=/workspace/data/pregenerated_tokens/mosi
      - ADAPTER_HIDDEN_SIZE=${ADAPTER_HIDDEN_SIZE:-512}
      - ADAPTER_LAYERS=${ADAPTER_LAYERS:-2}
      - USE_AMP=0
    volumes:
      - ./data:/workspace/data
      - ./src:/workspace/src
      - ./OptimalWeights:/workspace/OptimalWeights
      - ./Results:/workspace/Results
    command: python src/Training/train_adapters.py --mode encoder
    restart: unless-stopped

  # Ablation Study Service
  ablation-study:
    image: watsonwb/cs627-svs:gpu
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cs627-ablation
    environment:
      - DEVICE=${DEVICE:-cuda}
      - TOKEN_DIR=/workspace/data/pregenerated_tokens/mosi
      - RESULTS_DIR=/workspace/Results/ablation
    volumes:
      - ./data:/workspace/data
      - ./src:/workspace/src
      - ./OptimalWeights:/workspace/OptimalWeights
      - ./Results:/workspace/Results
      - ./configs:/workspace/configs
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command: python src/Experiments/run_ablation.py --config recommended
    restart: "no"

  # Development Service with Jupyter Lab
  dev:
    image: watsonwb/cs627-svs:dev
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: cs627-dev
    environment:
      - DEVICE=${DEVICE:-cuda}
      - JUPYTER_ENABLE_LAB=yes
    volumes:
      - .:/workspace
      - ./data:/workspace/data
      - ./OptimalWeights:/workspace/OptimalWeights
      - ./Results:/workspace/Results
    ports:
      - "8888:8888"  # Jupyter Lab
      - "6006:6006"  # TensorBoard
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    stdin_open: true
    tty: true
    restart: unless-stopped

  # Lightweight Ablation Study Service
  ablation:
    image: watsonwb/cs627-svs:ablation
    build:
      context: .
      dockerfile: Dockerfile.ablation
    container_name: cs627-ablation
    environment:
      - DEVICE=cpu  # CPU-only for cost efficiency
      - TOKEN_DIR=/workspace/data/tokens/mosi  # Pre-baked tokens
      - BATCH_SIZE=${BATCH_SIZE:-256}
      - EPOCHS=${EPOCHS:-30}
      - LEARNING_RATE=${LEARNING_RATE:-0.001}
    volumes:
      # Only mount results directory (tokens are pre-baked)
      - ./OptimalWeights:/workspace/OptimalWeights
      - ./Results:/workspace/Results
      - ./configs:/workspace/configs
    command: python src/Experiments/run_ablation.py --config recommended
    restart: "no"

  # Evaluation Service
  evaluate:
    image: watsonwb/cs627-svs:gpu
    container_name: cs627-evaluate
    environment:
      - DEVICE=${DEVICE:-cuda}
      - TOKEN_DIR=/workspace/data/pregenerated_tokens/mosi
    volumes:
      - ./data:/workspace/data
      - ./OptimalWeights:/workspace/OptimalWeights
      - ./Results:/workspace/Results
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command: python scripts/run_evaluation.py
    restart: "no"

  # Data preprocessing service
  preprocess:
    image: watsonwb/cs627-svs:cpu
    container_name: cs627-preprocess
    volumes:
      - ./data:/workspace/data
    command: bash -c "
      python scripts/data_wrangling/download_test_videos.py &&
      python scripts/data_wrangling/extract_test_segments.py
      "
    restart: "no"

  # Smoke test service
  test:
    image: watsonwb/cs627-svs:gpu
    container_name: cs627-test
    environment:
      - DEVICE=${DEVICE:-cuda}
    volumes:
      - ./src:/workspace/src
      - ./OptimalWeights:/workspace/OptimalWeights
      - ./tests:/workspace/tests
      - ./data:/workspace/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command: python -m pytest tests/unit/smoke_test.py -v
    restart: "no"

# Volumes for persistent data
volumes:
  mosi-data:
    driver: local
  model-weights:
    driver: local
  training-results:
    driver: local
  pregenerated-tokens:
    driver: local

# Networks
networks:
  default:
    name: cs627-network
    driver: bridge