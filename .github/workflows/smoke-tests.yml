name: Smoke Tests

on:
  pull_request:
    branches:
      - main
      - master
    types: [opened, synchronize, reopened]

jobs:
  smoke-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc
        sudo rm -rf /usr/local/share/boost
        sudo rm -rf "$AGENT_TOOLSDIRECTORY"
        df -h

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Cache HuggingFace models
      uses: actions/cache@v3
      with:
        path: ~/.cache/huggingface
        key: ${{ runner.os }}-huggingface-models-v1
        restore-keys: |
          ${{ runner.os }}-huggingface-models-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov

    - name: Run smoke tests
      run: |
        cd tests/unit
        python -m pytest smoke_test.py -v --tb=short
      env:
        PYTHONPATH: ${{ github.workspace }}

    - name: Clean up HuggingFace cache
      if: always()
      run: |
        rm -rf ~/.cache/huggingface/hub/models--*
        df -h

    - name: Check test results
      if: failure()
      run: |
        echo "Smoke tests failed. Please fix the issues before merging."
        exit 1

  verify-production-encoders:
    runs-on: ubuntu-latest
    needs: smoke-test

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Verify production encoders exist
      run: |
        python -c "
        import sys
        sys.path.insert(0, 'src')

        # Import production encoders (modality-based structure)
        from Encoders import Text_to_Vec, Audio_to_Vec, Image_to_Vec

        print('All production encoders imported successfully')
        "

    - name: Check encoder adapters
      run: |
        python -c "
        import sys
        sys.path.insert(0, 'src')

        from Encoders import Text_to_Vec, Audio_to_Vec, Image_to_Vec

        # Verify adapters exist
        encoders = {
            'Text_to_Vec': Text_to_Vec(),
            'Audio_to_Vec': Audio_to_Vec(),
            'Image_to_Vec': Image_to_Vec()
        }

        for name, encoder in encoders.items():
            assert hasattr(encoder, 'adapter'), f'{name} missing adapter'
            print(f'{name}: adapter OK')

        print('All encoder adapters verified')
        "
